# Perfil de Desenvolvimento Local (H2 em memória - sem necessidade de PostgreSQL ativo)
spring.datasource.url=jdbc:h2:mem:fitoedudev;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

# JWT & Segurança
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Console web do H2 acessível em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
